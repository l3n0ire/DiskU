name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Test and build
        id: build
        run: echo "zip=$(scripts/release.sh "$GITHUB_REF_NAME" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "DiskU ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "DiskU is not signed. After unzipping and opening DiskU.app, go to System Settings > Privacy & Security, scroll to the bottom, find DiskU, and click \"Open Anyway\". Runs on Apple Silicon and Intel Macs."
